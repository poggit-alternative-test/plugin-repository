# =============================================================================
# SUBMISSION CHECK WORKFLOW
# =============================================================================
#
# Processes plugin submission Pull Requests for security validation.
#
# SECURITY MODEL:
# - Uses pull_request trigger (not pull_request_target)
# - No privileged secrets exposed to PR code
# - Trusted tooling from base branch only
# - Only submission file comes from PR HEAD at exact SHA
#
# =============================================================================

name: Submission Check

on:
  pull_request:
    paths:
      - submissions/**
      - '!submissions/**/*.md'
    types: [opened, synchronize, reopened]

concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-submission:
    name: Validate Submission
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Get PR metadata
        id: pr-meta
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: changed-files
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr-meta.outputs.PR_NUMBER }}
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: process.env.PR_NUMBER
            });

            if (files.length === 0) {
              core.setFailed('No files changed');
              return;
            }

            if (files.length > 1) {
              core.setFailed(`Multiple files changed (${files.length}). Only one submission file allowed.`);
              return;
            }

            const file = files[0];
            console.log('Changed file:', file.filename);
            console.log('Status:', file.status);

            // Validate scope
            if (!file.filename.startsWith('submissions/')) {
              core.setFailed(`File must be in submissions/: ${file.filename}`);
              return;
            }

            if (!file.filename.match(/\.ya?ml$/)) {
              core.setFailed(`File must be YAML: ${file.filename}`);
              return;
            }

            core.setOutput('filename', file.filename);
            core.setOutput('status', file.status);

      - name: Fetch submission content
        id: fetch-content
        env:
          PR_HEAD_SHA: ${{ steps.changed-files.outputs.PR_HEAD_SHA }}
        run: |
          FILENAME="${{ steps.changed-files.outputs.filename }}"

          echo "Fetching $FILENAME from SHA: $PR_HEAD_SHA"

          # Use GitHub API to get file content
          gh api repos/${{ github.repository }}/contents/$FILENAME \
            --ref "$PR_HEAD_SHA" \
            --jq '.content' > content_b64.txt

          if [ ! -s content_b64.txt ]; then
            echo "ERROR: Could not fetch file content"
            exit 1
          fi

          # Decode and save
          mkdir -p submissions
          tr -d '\n' < content_b64.txt | base64 -d > "submissions/submission.yaml"

          echo "Content preview:"
          head -10 submissions/submission.yaml

      - name: Run inspection
        id: inspect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="submissions/submission.yaml"

          echo "=== Running submission inspection ==="

          if npm run submission:inspect -- "$FILE"; then
            echo "INSPECTION_RESULT=success" >> $GITHUB_OUTPUT
          else
            echo "INSPECTION_RESULT=failed" >> $GITHUB_OUTPUT
          fi

      - name: Post PR comment
        if: always()
        run: |
          RESULT="${{ steps.inspect.outputs.INSPECTION_RESULT }}"
          FILENAME="${{ steps.changed-files.outputs.filename }}"
          AUTHOR="${{ steps.pr-meta.outputs.PR_AUTHOR }}"
          PR_NUM="${{ steps.pr-meta.outputs.PR_NUMBER }}"

          if [ "$RESULT" = "success" ]; then
            EMOJI="✅"
            TITLE="Inspection Passed"
          else
            EMOJI="❌"
            TITLE="Inspection Failed"
          fi

          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body "${EMOJI} ${TITLE}

          File: \`${FILENAME}\`
          Author: @${AUTHOR}

          ---

          **Automated check by Axolotl Plugin Repository**"

          if [ "$RESULT" != "success" ]; then
            exit 1
          fi
