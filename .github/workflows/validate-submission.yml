name: Validate Plugin Submission

# ============================================================
# VALIDATION WORKFLOW (Untrusted Zone)
#
# This workflow runs on ALL pull requests including forks.
# NO SECRETS are available to this workflow.
# NO WRITE OPERATIONS are performed.
# ============================================================

on:
  pull_request:
    paths:
      - 'registry/plugins/*.yaml'
    branches:
      - main

# Security: Explicit minimal permissions
permissions:
  contents: read        # Read plugin repository
  pull-requests: write   # Post validation status

# Concurrency: Only run latest PR push
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Repository Validation
  # ============================================================
  validate-repository:
    name: Validate Repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this repository)
        uses: actions/checkout@v4

      - name: Extract repository info
        id: info
        run: |
          # Read plugin name from changed file
          PLUGIN_FILE=$(git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep '^registry/plugins/.*\.yaml$' | head -1)
          echo "plugin_file=$PLUGIN_FILE" >> $GITHUB_OUTPUT
          echo "plugin_name=$(basename $PLUGIN_FILE .yaml)" >> $GITHUB_OUTPUT

