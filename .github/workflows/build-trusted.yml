name: Build Trusted PHAR

# ============================================================
# TRUSTED BUILD WORKFLOW (Trusted Zone)
#
# This workflow runs ONLY after registry merge.
# Uses EXACT SHA from registry entry.
# Has publication secrets.
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'registry/plugins/*.yaml'

  workflow_dispatch:
    inputs:
      plugin_name:
        description: 'Plugin name'
        required: true
      version:
        description: 'Version to build'
        required: true

# Security: Explicit minimal permissions
permissions:
  contents: read        # Read registry and source
  actions: read/write   # Write build logs
  attestations: write   # Create attestations (future)

# Concurrency: Prevent parallel builds of same plugin
concurrency:
  group: build-${{ github.event.inputs.plugin_name || 'manual' }}
  cancel-in-progress: true

env:
  # Prevent script injection
  ACTIONS_ALLOW_UNSECURE_COMMANDS: false

jobs:
  # ============================================================
  # Job 1: Read Approved SHA
  # ============================================================
  read-registry:
    name: Read Registry Entry
    runs-on: ubuntu-latest
    outputs:
      plugin_name: ${{ steps.info.outputs.plugin_name }}
      version: ${{ steps.info.outputs.version }}
      approved_sha: ${{ steps.info.outputs.approved_sha }}
      repository: ${{ steps.info.outputs.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract registry info
        id: info
        run: |
          echo "TODO: Read from registry entry"
          echo "plugin_name: from changed file"
          echo "version: latest approval"
          echo "approved_sha: from approvals[]"
          echo "repository: from repository section"

      - name: Validate registry entry exists
        run: |
          echo "TODO: Verify registry entry has approved SHA"

  # ============================================================
  # Job 2: Checkout Exact SHA (CRITICAL)
  # ============================================================
  checkout-approved-sha:
    name: Checkout Approved Commit
    runs-on: ubuntu-latest
    needs: read-registry
    outputs:
      actual_sha: ${{ steps.verify.outputs.actual_sha }}
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@v4
        with:
          # CRITICAL: Use exact SHA from registry, NOT head ref
          ref: ${{ needs.read-registry.outputs.approved_sha }}
          fetch-depth: 1

      - name: Verify checkout SHA
        id: verify
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA="${{ needs.read-registry.outputs.approved_sha }}"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA mismatch! Build aborted."
            echo "::error::Expected: $EXPECTED_SHA"
            echo "::error::Actual: $ACTUAL_SHA"
            exit 1
          fi

          echo "sha=$ACTUAL_SHA" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 3: Validate Source
  # ============================================================
  validate-source:
    name: Validate Source Code
    runs-on: ubuntu-latest
    needs: [read-registry, checkout-approved-sha]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.read-registry.outputs.approved_sha }}
          fetch-depth: 1

      - name: Re-validate plugin.yml
        run: |
          echo "TODO: Re-validate plugin.yml at approved SHA"
          echo "IMPORTANT: Validate even though CI passed"
          echo "SHA could have changed between CI and build"

      - name: Security re-scan
        run: |
          echo "TODO: Quick security rescan at approved SHA"

  # ============================================================
  # Job 4: Build PHAR
  # ============================================================
  build-phar:
    name: Build PHAR
    runs-on: ubuntu-latest
    needs: [read-registry, checkout-approved-sha, validate-source]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.read-registry.outputs.approved_sha }}
          fetch-depth: 1

      - name: Setup PHP
        uses: actions/setup-php@v4
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          echo "TODO: Install composer dependencies"
          echo "- Only run composer install"
          echo "- DO NOT run arbitrary scripts from plugin"
          echo "- DO NOT expose secrets"

      - name: Build PHAR
        run: |
          echo "TODO: Build PHAR using controlled script"
          echo "- Use Axolotl's build script, not plugin's"
          echo "- Exclude: .git, vendor, .github, etc."
          echo "- Include: src/, resources/, plugin.yml"

      - name: Verify PHAR contents
        run: |
          echo "TODO: Verify PHAR contents"
          echo "- No .git directory"
          echo "- No secrets or credentials"
          echo "- No symlinks"
          echo "- No unexpected files"

      - name: Upload PHAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: phar-${{ needs.read-registry.outputs.plugin_name }}-${{ needs.read-registry.outputs.version }}
          path: build/*.phar
          retention-days: 30

  # ============================================================
  # Job 5: Generate Checksums
  # ============================================================
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build-phar
    steps:
      - name: Download PHAR artifact
        uses: actions/download-artifact@v4
        with:
          name: phar-${{ needs.read-registry.outputs.plugin_name }}-${{ needs.read-registry.outputs.version }}

      - name: Calculate SHA-256
        id: checksum
        run: |
          sha256sum *.phar > checksums.txt
          SHA256=$(cut -d' ' -f1 checksums.txt)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ needs.read-registry.outputs.plugin_name }}-${{ needs.read-registry.outputs.version }}
          path: checksums.txt
          retention-days: 30

  # ============================================================
  # Summary
  # ============================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [read-registry, checkout-approved-sha, validate-source, build-phar, checksums]
    if: always()
    steps:
      - name: Report build summary
        run: |
          echo "=================================="
          echo "Trusted Build Summary"
          echo "=================================="
          echo "Plugin: ${{ needs.read-registry.outputs.plugin_name }}"
          echo "Version: ${{ needs.read-registry.outputs.version }}"
          echo "Approved SHA: ${{ needs.read-registry.outputs.approved_sha }}"
          echo "Build SHA: ${{ needs.checkout-approved-sha.outputs.actual_sha }}"
          echo ""
          echo "SHA Verification: $([ '${{ needs.read-registry.outputs.approved_sha }}' = '${{ needs.checkout-approved-sha.outputs.actual_sha }}' ] && echo 'VERIFIED' || echo 'FAILED')"
          echo ""
          echo "This PHAR was built from the EXACT approved SHA."
          echo "SHA pinning ensures no post-review changes."
