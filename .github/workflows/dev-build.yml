# =============================================================================
# DEV BUILD WORKFLOW
# =============================================================================
# Auto-triggered on every push to main/dev branch
# Creates a "dev build" release for testing
#
# SETUP: Developer copies this to their .github/workflows/axolotl-dev-build.yml
#         Then every push to main/dev will auto-build!
#
# =============================================================================

name: Dev Build

on:
  push:
    branches: [main, master, dev, development]
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Custom version (optional)'
        required: false
        default: ''

env:
  PHP_VERSION: '8.2'

jobs:
  dev-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      phar_path: ${{ steps.build.outputs.phar_path }}
      sha256: ${{ steps.build.outputs.sha256 }}
      size_bytes: ${{ steps.build.outputs.size_bytes }}
      plugin_version: ${{ steps.build.outputs.plugin_version }}

    steps:
      # ------------------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: zip, phar

      - name: Get plugin name from plugin.yml
        id: plugin-name
        run: |
          if [ -f plugin.yml ]; then
            PLUGIN_NAME=$(grep -E "^name:" plugin.yml | sed 's/name:\s*//' | tr -d '"' | tr -d "'" | tr -d '[:space:]')
            echo "plugin_name=${PLUGIN_NAME}" >> $GITHUB_OUTPUT
          else
            echo "plugin_name=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT
          fi

      - name: Get plugin version from plugin.yml
        id: version
        run: |
          if [ -f plugin.yml ]; then
            VERSION=$(grep -E "^version:" plugin.yml | sed 's/version:\s*//' | tr -d '"' | tr -d "'" | tr -d '[:space:]')
          else
            VERSION="snapshot"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="snapshot"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup variables
        id: vars
        run: |
          PLUGIN_NAME="${{ steps.plugin-name.outputs.plugin_name }}"
          if [ -z "$PLUGIN_NAME" ]; then
            PLUGIN_NAME="${GITHUB_REPOSITORY##*/}"
          fi

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          SHA_SHORT=${GITHUB_SHA:0:8}
          VERSION="${{ steps.version.outputs.version }}"

          # Use custom version if provided
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          fi

          DEV_VERSION="${VERSION}-dev.${SHA_SHORT}"
          TAG_NAME="dev-${SHA_SHORT}"

          echo "plugin_name=${PLUGIN_NAME}" >> $GITHUB_OUTPUT
          echo "dev_version=${DEV_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "phar_name=${PLUGIN_NAME}-dev.phar" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Install Dependencies
      # ------------------------------------------------------------------------
      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader || true
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

      # ------------------------------------------------------------------------
      # Download Pharynx
      # ------------------------------------------------------------------------
      - name: Download Pharynx PHAR Builder
        id: pharynx
        run: |
          mkdir -p .build

          # Try primary source first, then fallback
          curl -sL --fail --max-time 30 \
            -o .build/pharynx.phar \
            "https://github.com/SOF3/Pharynx/releases/latest/download/pharynx.phar" \
            && echo "pharynx_status=downloaded" >> $GITHUB_OUTPUT \
            || echo "pharynx_status=fallback" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Build PHAR
      # ------------------------------------------------------------------------
      - name: Build PHAR with Pharynx
        id: build
        run: |
          PLUGIN_NAME="${{ steps.vars.outputs.plugin_name }}"
          DEV_VERSION="${{ steps.vars.outputs.dev_version }}"
          PHAR_NAME="${{ steps.vars.outputs.phar_name }}"

          echo "=== Building ${PHAR_NAME} ==="
          echo "Version: ${DEV_VERSION}"

          # Determine build method
          if [ "${{ steps.pharynx.outputs.pharynx_status }}" = "downloaded" ] && [ -f .build/pharynx.phar ]; then
            echo "Building with Pharynx..."

            # Check if composer.json exists for composer mode
            if [ -f composer.json ]; then
              php .build/pharynx.phar \
                -i . \
                -o .build \
                -p="${PHAR_NAME}" \
                -c \
                2>&1 || echo "Composer mode failed, trying without..."
            fi

            # Try without composer mode if -c failed
            if [ ! -f ".build/${PHAR_NAME}" ]; then
              php .build/pharynx.phar \
                -i . \
                -o .build \
                -p="${PHAR_NAME}" \
                2>&1 || echo "Pharynx build failed"
            fi
          else
            echo "Pharynx not available, creating stub PHAR..."
          fi

          # Fallback: Create a simple PHAR stub if Pharynx failed
          if [ ! -f ".build/${PHAR_NAME}" ]; then
            echo "Creating stub PHAR..."
            mkdir -p ".build/stub-plugin"
            cp -r src ".build/stub-plugin/" 2>/dev/null || mkdir -p ".build/stub-plugin"
            cp plugin.yml ".build/stub-plugin/" 2>/dev/null || true

            # Create minimal PHAR-like archive for testing
            PHAR_NAME="${PLUGIN_NAME}-dev-stub.phar"
          fi

          # Final verification
          if [ -f ".build/${PHAR_NAME}" ]; then
            SHA256=$(sha256sum ".build/${PHAR_NAME}" | awk '{print $1}')
            SIZE=$(wc -c < ".build/${PHAR_NAME}")

            echo "phar_path=.build/${PHAR_NAME}" >> $GITHUB_OUTPUT
            echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
            echo "size_bytes=${SIZE}" >> $GITHUB_OUTPUT
            echo "plugin_version=${DEV_VERSION}" >> $GITHUB_OUTPUT

            echo "Build successful: ${PHAR_NAME}"
            echo "SHA-256: ${SHA256}"
            echo "Size: ${SIZE} bytes"
          else
            echo "ERROR: No PHAR file created"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # Generate Checksums
      # ------------------------------------------------------------------------
      - name: Generate checksums
        run: |
          cd .build
          {
            echo "# Checksums for ${{ steps.vars.outputs.dev_version }}"
            echo "# Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } > checksums.txt

          for f in *.phar; do
            if [ -f "$f" ]; then
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $f" >> checksums.txt
            fi
          done
          cat checksums.txt

      # ------------------------------------------------------------------------
      # Create Dev Release
      # ------------------------------------------------------------------------
      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Dev Build - ${{ steps.vars.outputs.dev_version }}"
          body: |
            ## Dev Build - ${{ steps.vars.outputs.plugin_version }}

            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`
            **Built:** `{{ steps.build.outputs.plugin_version }}`

            ### SHA-256
            ```
            ${{ steps.build.outputs.sha256 }}
            ```

            ### Files
            - PHAR: `${{ steps.build.outputs.phar_path }}`
            - Size: `${{ steps.build.outputs.size_bytes }}` bytes

            ---
            *Built automatically by Axolotl Plugin Repository*
          files: |
            .build/*.phar
            .build/checksums.txt
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Notify Plugin Registry (Webhook)
      # ------------------------------------------------------------------------
      - name: Notify Plugin Registry
        if: success()
        run: |
          echo "Dev build completed successfully!"
          echo ""
          echo "Tag: ${{ steps.vars.outputs.tag_name }}"
          echo "Version: ${{ steps.build.outputs.plugin_version }}"
          echo "SHA-256: ${{ steps.build.outputs.sha256 }}"

          # Uncomment to send webhook notification:
          # curl -X POST ${{ secrets.PLUGIN_REGISTRY_WEBHOOK_URL }} \
          #   -H "Content-Type: application/json" \
          #   -H "X-Webhook-Secret: ${{ secrets.WEBHOOK_SECRET }}" \
          #   -d "{\"event\":\"dev_build\",\"repository\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"tag\":\"${{ steps.vars.outputs.tag_name }}\",\"version\":\"${{ steps.build.outputs.plugin_version }}\"}"

      # ------------------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## Dev Build Summary"
          echo ""
          echo "| Property | Value |"
          echo "|----------|-------|"
          echo "| Plugin | ${{ steps.vars.outputs.plugin_name }} |"
          echo "| Version | ${{ steps.build.outputs.plugin_version }} |"
          echo "| Tag | \`${{ steps.vars.outputs.tag_name }}\` |"
          echo "| SHA-256 | \`${{ steps.build.outputs.sha256 }}\` |"
          echo "| Size | ${{ steps.build.outputs.size_bytes }} bytes |"
          echo "| Commit | \`${{ github.sha }}\` |"
          echo "| Branch | \`${{ github.ref_name }}\` |"
          echo ""
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag_name }}"
