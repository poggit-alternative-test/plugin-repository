# =============================================================================
# RELEASE BUILD WORKFLOW
# =============================================================================
# Auto-triggered when a version tag (v*.*.*) is pushed
# Creates a proper release for the plugin repository
#
# SETUP: Developer copies this to their .github/workflows/axolotl-release.yml
#
# =============================================================================

name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0)'
        required: true
        type: string

env:
  PHP_VERSION: '8.2'

jobs:
  # --------------------------------------------------------------------------
  # Stage 1: Validation
  # --------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
      plugin_name: ${{ steps.plugin_info.outputs.plugin_name }}
      plugin_api: ${{ steps.plugin_info.outputs.plugin_api }}
      plugin_author: ${{ steps.plugin_info.outputs.plugin_author }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        run: |
          # Get version from tag ref
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"  # Remove leading v if present
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Check if prerelease
          if [[ "${VERSION}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "Extracted version: ${VERSION}"

      - name: Validate plugin.yml
        id: plugin_info
        run: |
          if [ ! -f plugin.yml ]; then
            echo "ERROR: plugin.yml not found"
            exit 1
          fi

          echo "=== plugin.yml validation ==="

          # Extract plugin info
          NAME=$(grep -E "^name:" plugin.yml | sed 's/name:\s*//' | tr -d '"'"'"' | tr -d '[:space:]')
          VERSION_PKG=$(grep -E "^version:" plugin.yml | sed 's/version:\s*//' | tr -d '"'"'"' | tr -d '[:space:]')
          API=$(grep -E "^api:" plugin.yml | sed 's/api:\s*//' | tr -d '"'"'"' | tr -d '[:space:]' | sed 's/\s.*//')
          AUTHOR=$(grep -E "^author:" plugin.yml | sed 's/author:\s*//' | tr -d '"'"'"' | cut -d',' -f1 | tr -d '[:space:]')

          echo "plugin_name=${NAME}" >> $GITHUB_OUTPUT
          echo "plugin_version=${VERSION_PKG}" >> $GITHUB_OUTPUT
          echo "plugin_api=${API}" >> $GITHUB_OUTPUT
          echo "plugin_author=${AUTHOR}" >> $GITHUB_OUTPUT

          echo "Plugin: ${NAME} v${VERSION_PKG}"
          echo "API: ${API}"

          # Validate version matches tag
          if [ -n "${VERSION_PKG}" ] && [ "${VERSION_PKG}" != "${VERSION}" ]; then
            echo "WARNING: plugin.yml version (${VERSION_PKG}) doesn't match tag (${VERSION})"
          fi

  # --------------------------------------------------------------------------
  # Stage 2: Build
  # --------------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      phar_path: ${{ steps.build.outputs.phar_path }}
      sha256: ${{ steps.build.outputs.sha256 }}
      size_bytes: ${{ steps.build.outputs.size_bytes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: zip, phar

      - name: Install Composer dependencies
        if: hashFiles('composer.json') != ''
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader || true

      - name: Download Pharynx
        id: pharynx
        run: |
          mkdir -p .build

          curl -sL --fail --max-time 60 -o .build/pharynx.phar \
            "https://github.com/SOF3/Pharynx/releases/latest/download/pharynx.phar" \
            && echo "pharynx_status=downloaded" >> $GITHUB_OUTPUT \
            || echo "pharynx_status=fallback" >> $GITHUB_OUTPUT

      - name: Build PHAR
        id: build
        run: |
          PLUGIN_NAME="${{ needs.validate.outputs.plugin_name }}"
          VERSION="${{ needs.validate.outputs.version }}"
          PHAR_NAME="${PLUGIN_NAME}-${VERSION}.phar"

          echo "=== Building ${PHAR_NAME} ==="

          # Try Pharynx if available
          if [ "${{ steps.pharynx.outputs.pharynx_status }}" = "downloaded" ] && [ -f .build/pharynx.phar ]; then
            echo "Building with Pharynx..."

            if [ -f composer.json ]; then
              php .build/pharynx.phar \
                -i . \
                -o ".build" \
                -p="${PHAR_NAME}" \
                -c 2>&1 || echo "Composer mode failed, trying without..."
            fi

            if [ ! -f ".build/${PHAR_NAME}" ]; then
              php .build/pharynx.phar \
                -i . \
                -o ".build" \
                -p="${PHAR_NAME}" 2>&1 || echo "Pharynx build failed"
            fi
          else
            echo "Pharynx not available, build will fail"
          fi

          # Verify PHAR was created
          if [ -f ".build/${PHAR_NAME}" ]; then
            SHA256=$(sha256sum ".build/${PHAR_NAME}" | awk '{print $1}')
            SIZE=$(wc -c < ".build/${PHAR_NAME}")

            echo "phar_path=.build/${PHAR_NAME}" >> $GITHUB_OUTPUT
            echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
            echo "size_bytes=${SIZE}" >> $GITHUB_OUTPUT

            echo "Build successful!"
            echo "SHA-256: ${SHA256}"
            echo "Size: ${SIZE} bytes"
          else
            echo "ERROR: PHAR build failed"
            exit 1
          fi

      - name: Generate checksums
        run: |
          cd .build
          {
            echo "# SHA-256 checksums for ${{ needs.validate.outputs.version }}"
            echo "# Generated by Axolotl Plugin Repository"
            echo "# $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
          } > checksums.txt

          for f in *.phar; do
            if [ -f "$f" ]; then
              echo "$(sha256sum "$f" | cut -d' ' -f1)  $f" >> checksums.txt
            fi
          done
          cat checksums.txt

      - name: Generate metadata.json
        run: |
          cd .build
          cat > metadata.json << EOF
          {
            "schema_version": 1,
            "plugin_name": "${{ needs.validate.outputs.plugin_name }}",
            "version": "${{ needs.validate.outputs.version }}",
            "api_version": "${{ needs.validate.outputs.plugin_api }}",
            "author": "${{ needs.validate.outputs.plugin_author }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source_sha256": "${{ steps.build.outputs.sha256 }}",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "tag": "v${{ needs.validate.outputs.version }}"
          }
          EOF

          cat metadata.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.version }}
          path: .build/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Stage 3: Publish Release
  # --------------------------------------------------------------------------
  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.validate.outputs.version }}
          path: .build

      - name: Checkout for changelog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        run: |
          TAG_NAME="v${{ needs.validate.outputs.version }}"

          echo "=== Release Notes for ${TAG_NAME} ==="

          # Try to generate changelog from commits
          CHANGELOG=""
          if git rev-parse "${TAG_NAME}~1" >/dev/null 2>&1; then
            CHANGELOG=$(git changelog --quiet "${TAG_NAME}" 2>/dev/null || echo "")
          fi

          cat > release_notes.md << RELEASENOTES
          # ${{ needs.validate.outputs.plugin_name }} ${{ needs.validate.outputs.version }}

          ${{ needs.validate.outputs.plugin_api && steps.metadata.outputs.plugin_description }}

          ## Downloads

          | File | SHA-256 |
          |------|---------|
          | PHAR | \`${{ needs.build.outputs.sha256 }}\` |
          | checksums.txt | [View](checksums.txt) |
          | metadata.json | [View](metadata.json) |

          ## Installation

          Download the \`.phar\` file and place it in your server's \`plugins/\` folder.

          ## System Requirements

          - PocketMine-MP API: ${{ needs.validate.outputs.plugin_api }}
          - PHP: ${{ env.PHP_VERSION }}+

          ## Changelog

          ${CHANGELOG:-_No changelog available._}

          ---
          *Built automatically by [Axolotl Plugin Repository](https://github.com/axolotl-pm)*

          RELEASENOTES

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: "${{ needs.validate.outputs.plugin_name }} ${{ needs.validate.outputs.version }}"
          body_path: release_notes.md
          files: |
            .build/*.phar
            .build/checksums.txt
            .build/metadata.json
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Success notification
        run: |
          echo "🎉 Release ${{ needs.validate.outputs.version }} published successfully!"
          echo ""
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.validate.outputs.version }}"
