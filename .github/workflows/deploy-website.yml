name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'apps/website/**'
      - 'public/generated/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/website/node_modules
          key: website-modules-${{ hashFiles('apps/website/package-lock.json') }}
          restore-keys: |
            website-modules-

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci

      - name: Build
        working-directory: apps/website
        run: npm run build

      - name: Copy generated data to dist
        run: |
          mkdir -p apps/website/dist/generated
          cp -r public/generated/* apps/website/dist/generated/ 2>/dev/null || true
          cp public/brand/logo/mark.svg apps/website/dist/brand/logo/mark.svg 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
