name: Discover Plugins

on:
  schedule:
    # Every 6 hours
    - cron: '0 */6 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force full refresh of all plugins'
        required: false
        default: false
        type: boolean

  # Allow triggering from other workflows
  repository_dispatch:
    types: [refresh-plugins]

# Limit concurrent runs
concurrency:
  group: discover-plugins
  cancel-in-progress: false

# Permissions
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plugin_count: ${{ steps.discover.outputs.plugin_count }}
      verified_count: ${{ steps.discover.outputs.verified_count }}
      skipped_count: ${{ steps.discover.outputs.skipped_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover plugins
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > discover.mjs << 'EOF'
          import fs from 'fs';

          const TOKEN = process.env.GH_TOKEN;
          const FORCE_REFRESH = process.env.FORCE_REFRESH === 'true';

          // Stats tracking
          let stats = {
            totalFound: 0,
            noRelease: 0,
            noPluginYml: 0,
            skippedForks: 0,
            duplicates: 0,
            processed: 0
          };

          // Track plugin names to avoid duplicates
          const pluginNameMap = new Map(); // pluginName -> { repo, stars, data }

          async function api(path, options = {}) {
            try {
              const url = path.startsWith('http') ? path : `https://api.github.com${path}`;
              const res = await fetch(url, {
                ...options,
                headers: {
                  'Authorization': `Bearer ${TOKEN}`,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  ...options.headers
                }
              });

              if (!res.ok) {
                if (res.status === 403) {
                  const retryAfter = res.headers.get('retry-after');
                  console.warn(`Rate limited. Retry after: ${retryAfter}s`);
                }
                return null;
              }

              return await res.json();
            } catch (e) {
              console.error(`API Error for ${path}:`, e.message);
              return null;
            }
          }

          async function getPluginYml(owner, repo) {
            try {
              const content = await api(`/repos/${owner}/${repo}/contents/plugin.yml`);
              if (!content || !content.content) return null;

              // Decode base64
              const yaml = Buffer.from(content.content, 'base64').toString('utf-8');

              // Simple parse
              const lines = yaml.split('\n');
              const plugin = {};

              for (const line of lines) {
                const colonIndex = line.indexOf(':');
                if (colonIndex === -1) continue;

                const key = line.substring(0, colonIndex).trim();
                const value = line.substring(colonIndex + 1).trim();

                if (key && value) {
                  plugin[key] = value;
                }
              }

              return plugin;
            } catch (e) {
              return null;
            }
          }

          async function getLatestRelease(owner, repo) {
            try {
              const release = await api(`/repos/${owner}/${repo}/releases/latest`);
              if (!release || release.message === 'Not Found') return null;

              return {
                tag: release.tag_name,
                name: release.name || release.tag_name,
                url: release.html_url,
                published_at: release.published_at,
                is_draft: release.draft,
                is_prerelease: release.prerelease,
                body: release.body,
                assets: (release.assets || [])
                  .filter(a => a.name.endsWith('.phar') || a.name.endsWith('.phar.zip'))
                  .map(a => ({
                    name: a.name,
                    download_url: a.browser_download_url,
                    size: a.size,
                    downloads: a.download_count || 0
                  }))
              };
            } catch (e) {
              return null;
            }
          }

          async function verifyRelease(owner, repo) {
            try {
              const runs = await api(`/repos/${owner}/${repo}/actions/runs?per_page=10`);

              if (!runs || !runs.workflow_runs) {
                return { is_verified: false, workflow_info: 'No workflow runs found' };
              }

              const verifiedRun = runs.workflow_runs.find(run =>
                (run.path?.includes('pmmp-plugin-actions') ||
                 run.path?.includes('build-phar') ||
                 run.path?.includes('release') ||
                 run.name?.toLowerCase().includes('build')) &&
                run.conclusion === 'success'
              );

              return {
                is_verified: !!verifiedRun,
                verified_at: verifiedRun?.created_at || null,
                workflow_name: verifiedRun?.name || null,
                workflow_info: verifiedRun
                  ? `Built by ${verifiedRun.name}`
                  : 'No verified workflow found'
              };
            } catch (e) {
              return { is_verified: false, workflow_info: 'Error checking verification' };
            }
          }

          function createPluginEntry(repoData, plugin, release, verification, fullName, owner, repo) {
            return {
              repo: fullName,
              repo_url: repoData.html_url,
              description: repoData.description,
              is_fork: repoData.fork,
              parent_repo: repoData.parent?.full_name || null,
              plugin: {
                name: plugin.name,
                version: plugin.version || release?.tag?.replace(/^v/, ''),
                api: plugin.api,
                author: plugin.author || plugin.authors?.[0] || repoData.owner?.login || owner,
                main: plugin.main
              },
              stats: {
                stars: repoData.stargazers_count,
                forks: repoData.forks_count,
                open_issues: repoData.open_issues_count,
                watchers: repoData.subscribers_count
              },
              release: release,
              verification: verification,
              last_updated: repoData.pushed_at,
              created_at: repoData.created_at
            };
          }

          async function main() {
            console.log('🔍 Searching for plugins with pmmp-plugin-actions...\n');
            console.log('📋 Deduplication Rules:');
            console.log('   1. Skip repos without releases');
            console.log('   2. Skip forks (show only original repos)');
            console.log('   3. Same plugin name = keep most starred\n');

            // Search for repos with pmmp-plugin-actions workflow
            const searchRes = await fetch(
              'https://api.github.com/search/code?' +
              new URLSearchParams({
                q: 'path:.github/workflows "pmmp-plugin-actions"',
                per_page: '100',
                sort: 'indexed',
                order: 'desc'
              }),
              {
                headers: {
                  'Authorization': `Bearer ${TOKEN}`,
                  'Accept': 'application/vnd.github+json'
                }
              }
            );

            const searchData = await searchRes.json();
            const repos = [...new Set(
              (searchData.items || [])
                .map(item => item.repository.full_name)
                .filter(repo => repo && repo.includes('/'))
            )];

            stats.totalFound = repos.length;
            console.log(`📦 Found ${repos.length} potential repositories\n`);

            const plugins = [];

            for (const fullName of repos) {
              const [owner, repo] = fullName.split('/');
              if (!owner || !repo) continue;

              process.stdout.write(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`);
              process.stdout.write(`Processing: ${fullName}\n`);

              try {
                // Get repo info first
                const repoData = await api(`/repos/${owner}/${repo}`);
                if (!repoData || repoData.message === 'Not Found') {
                  console.log(`⚠️ Repository not found or not accessible\n`);
                  continue;
                }

                // STEP 1: Skip forks - we want only original repos
                if (repoData.fork) {
                  console.log(`⏭️ Skipping fork: ${fullName}`);
                  console.log(`   (Forked from: ${repoData.parent?.full_name || 'unknown'})\n`);
                  stats.skippedForks++;
                  continue;
                }

                // STEP 2: Skip repos without releases
                const release = await getLatestRelease(owner, repo);
                if (!release) {
                  console.log(`⏭️ Skipping: No release found\n`);
                  stats.noRelease++;
                  continue;
                }

                // Get plugin.yml
                const plugin = await getPluginYml(owner, repo);
                if (!plugin || !plugin.name) {
                  console.log(`⏭️ Skipping: No valid plugin.yml\n`);
                  stats.noPluginYml++;
                  continue;
                }

                console.log(`✅ Plugin: ${plugin.name} v${plugin.version}`);

                // Verify
                const verification = await verifyRelease(owner, repo);
                console.log(`🔐 Verification: ${verification.is_verified ? 'VERIFIED' : 'NOT VERIFIED'}`);
                console.log(`📦 Release: ${release.tag}`);

                // STEP 3: Deduplicate by plugin name
                const pluginName = plugin.name.toLowerCase().trim();
                const existing = pluginNameMap.get(pluginName);

                if (existing) {
                  // Same plugin name exists
                  if (repoData.stargazers_count > existing.stars) {
                    // This one has more stars - replace
                    console.log(`🔄 Replacing duplicate: ${existing.repo} (⭐${existing.stars}) → ${fullName} (⭐${repoData.stargazers_count})`);
                    // Remove old entry
                    const idx = plugins.findIndex(p => p.repo === existing.repo);
                    if (idx !== -1) plugins.splice(idx, 1);
                    // Add new one
                    plugins.push(createPluginEntry(repoData, plugin, release, verification, fullName, owner, repo));
                    pluginNameMap.set(pluginName, { repo: fullName, stars: repoData.stargazers_count });
                    stats.duplicates++;
                  } else {
                    console.log(`⏭️ Skipping duplicate: ${fullName} (⭐${repoData.stargazers_count}) vs ${existing.repo} (⭐${existing.stars})\n`);
                    stats.duplicates++;
                  }
                } else {
                  // First time seeing this plugin name
                  console.log(`✨ New plugin: ${plugin.name}`);
                  plugins.push(createPluginEntry(repoData, plugin, release, verification, fullName, owner, repo));
                  pluginNameMap.set(pluginName, { repo: fullName, stars: repoData.stargazers_count });
                }

                stats.processed++;
                console.log('');

              } catch (e) {
                console.error(`❌ Error processing ${fullName}: ${e.message}\n`);
              }
            }

            // Sort by stars
            plugins.sort((a, b) => b.stats.stars - a.stats.stars);

            // Count verified
            const verifiedCount = plugins.filter(p => p.verification.is_verified).length;

            console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
            console.log(`📊 Discovery Summary:`);
            console.log(`   Total found in search: ${stats.totalFound}`);
            console.log(`   Processed: ${stats.processed}`);
            console.log(`   Skipped (no release): ${stats.noRelease}`);
            console.log(`   Skipped (no plugin.yml): ${stats.noPluginYml}`);
            console.log(`   Skipped (forks): ${stats.skippedForks}`);
            console.log(`   Duplicates resolved: ${stats.duplicates}`);
            console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`);
            console.log(`✅ Final plugins: ${plugins.length}`);
            console.log(`🔐 Verified: ${verifiedCount}`);

            // Save to JSON
            fs.writeFileSync('plugins.json', JSON.stringify(plugins, null, 2));

            // Output for GitHub Actions
            fs.writeFileSync('plugin_count.txt', String(plugins.length));
            fs.writeFileSync('verified_count.txt', String(verifiedCount));
            fs.writeFileSync('skipped_count.txt', String(stats.noRelease + stats.noPluginYml + stats.skippedForks));
          }

          main().catch(e => {
            console.error('Fatal error:', e);
            process.exit(1);
          });
          EOF

          echo "FORCE_REFRESH=${{ inputs.force_refresh }}" >> $GITHUB_ENV
          node discover.mjs

      - name: Set outputs
        run: |
          echo "plugin_count=$(cat plugin_count.txt)" >> $GITHUB_OUTPUT
          echo "verified_count=$(cat verified_count.txt)" >> $GITHUB_OUTPUT
          echo "skipped_count=$(cat skipped_count.txt)" >> $GITHUB_OUTPUT

      - name: Update website data
        run: |
          mkdir -p apps/website/public/generated/plugins
          cp plugins.json apps/website/public/generated/plugins/index.json

      - name: Generate summary
        run: |
          echo "### Plugin Discovery Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total Plugins | ${{ steps.discover.outputs.plugin_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Verified | ${{ steps.discover.outputs.verified_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | ${{ steps.discover.outputs.skipped_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Top Plugins" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          cat plugins.json | jq -r '.[0:10] | .[] | "| \(.plugin.name) | ⭐ \(.stats.stars) | \(if .verification.is_verified then "✅" else "⚠️" end) |"' >> $GITHUB_STEP_SUMMARY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/website/public/generated/plugins/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "Committing plugin data..."
            git commit -m "chore: update plugin discovery $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugins-data
          path: |
            plugins.json
            plugin_count.txt
            verified_count.txt
            skipped_count.txt
          retention-days: 7

  # Build and deploy website if plugins were found
  build:
    needs: discover
    runs-on: ubuntu-latest
    if: needs.discover.outputs.plugin_count != '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/website/node_modules
          key: website-modules-${{ hashFiles('apps/website/package-lock.json') }}
          restore-keys: |
            website-modules-

      - name: Install dependencies
        working-directory: apps/website
        run: npm ci

      - name: Build
        working-directory: apps/website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  # Deploy website
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: needs.discover.outputs.plugin_count != '0'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
